<!DOCTYPE html>
<html>
<head>
    <title>Verify Signature</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Verify Digital Signature</h1>

<form method="POST"
      enctype="multipart/form-data">

    <label>Select Document:</label>

    <input type="file"
           name="document"
           required>

    <br><br>

    <label>Paste Signature:</label>

    <br>

    <textarea name="signature"
              rows="10"
              cols="80"
              required></textarea>

    <br><br>

    <button type="submit">
        Verify
    </button>

</form>

{% if valid is defined %}

<hr>

{% if valid %}

<h2 style="color: green;">
    Signature is VALID ✓
</h2>

{% else %}

<h2 style="color: red;">
    Signature is INVALID ✗
</h2>

{% endif %}

{% endif %}

<a href="/">Back to Home</a>

</div>

</body>
</html>
